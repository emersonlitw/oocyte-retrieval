.iso{--hsg-endo:#e7e6e0;--hsg-slit:#d9d8d2;--hsg-dye:#2a2a2e;--hsg-follicle:#ededea;--hsg-ovhaze:#e6e6e2}.iso[data-theme="dark"]{--hsg-endo:#2c2c2c;--hsg-slit:#141414;--hsg-dye:#f2f2f0;--hsg-follicle:#202020;--hsg-ovhaze:#2f2f31}.hsg-endo{fill:var(--hsg-endo);stroke:none}.hsg-slit{fill:var(--hsg-slit);stroke:none}.hsg-follicle{fill:var(--hsg-follicle);stroke:none}.hsg-ovhaze{fill:var(--hsg-ovhaze);stroke:none;opacity:.8;filter:blur(2.5px)}.hsg-dye{fill:var(--hsg-dye);stroke:none}.iso[data-theme="light"] .hsg-halo-soft{opacity:calc(var(--anatomy-halo-opacity) * .45)}.iso{--hsg-screen:#111113;--hsg-xray:#f4f4f2;--hsg-xray-cath:#8e8e92;--hsg-rim:#3a3a3e}.iso[data-theme="dark"]{--hsg-screen:#030303;--hsg-xray:#f4f4f2;--hsg-xray-cath:#8e8e92;--hsg-rim:#5a5a5e}.xr-bg{fill:var(--hsg-screen);stroke:none}.xr-rim{fill:none;stroke:var(--hsg-rim);stroke-width:.6}.xr-dye{fill:var(--hsg-xray);stroke:none}.xr-spill{fill:var(--hsg-xray);stroke:none;opacity:.22;filter:blur(.8px)}.xr-streak{fill-opacity:.92}.xr-ball{fill:var(--hsg-screen);fill-opacity:.82;stroke:none}.xr-cath{fill:none;stroke:var(--hsg-xray-cath);stroke-width:1.4;stroke-linecap:round}.xr-label{fill:var(--hsg-xray);fill-opacity:.9;font-family:var(--anatomy-mono);letter-spacing:.04em}.xr-flash{fill:#ffffff;stroke:none;pointer-events:none}</style></head><body class="iso" data-theme="light"><script>try{var q=matchMedia("(prefers-color-scheme: dark)");var f=function(){document.body.dataset.theme=q.matches?"dark":"light"};f();q.addEventListener("change",f)}catch(e){}</script><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">圖 1</span><span class="iso-plate-corner" data-corner="title">取卵手術</span><span class="iso-plate-corner" data-corner="hint">點按 · 拖曳</span><span class="iso-plate-corner" data-corner="readout" data-readout>7/7 取卵結束 · 一側卵巢</span></div><div class="ic-stage" tabindex="0" role="group" aria-roledescription="分步圖解" aria-label="取卵手術七個步驟。方向鍵 ← → 切換步驟，空白鍵播放或暫停。"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg or-fig" viewBox="0 0 600 440" role="img" aria-label="取卵手術（經陰道超音波導引取卵）的示意圖，從正上方往下看：子宮、子宮頸、兩側輸卵管與卵巢以冠狀切面剖半，切面朝上；子宮中線直立，子宮底在上方，子宮頸在下方。兩側卵巢放大畫成主角，往下貼到子宮頸與陰道壁交接的穹窿，兩側一樣；切面上大的濾泡互相擠成略多角形，還有幾個小濾泡，濾泡裡都是淡黃色的濾泡液。子宮頸兩側各有一條細線代表陰道壁，從穹窿往下延伸、漸淡，探頭一直在兩條陰道壁之間。一支套著保護套的乳白色陰道超音波探頭：第 1 步沿著子宮中線，前端圓頂正對子宮頸外口；之後以前端圓頂為支點整支轉向，讓濾泡落在導引線上；換到另一側時鏡像對稱。探頭柄上畫斷線記號截短，斷口後的柄逐漸變淡；探頭上用兩個乳白色半環夾夾著導引架，導引架中間是一根金屬灰色的空心管；取卵針（17 G 雙腔針）從導引架前端穿出，針尖側面看是直角三角形、尖角約 17°、斜面朝子宮，穿過陰道壁細線進入卵巢。針尾的針座跟著針一起前進、後退；針座有兩個接頭：直的接頭接吸引管，通到加溫架上試管的蓋子；側邊的接頭接沖洗管，通到直立、筒嘴朝上的 50 mL 注射筒（示意尺寸）。兩條管的轉角都是圓弧，不穿過其他器材；管裡用深色小箭頭「›」表示液體流動的方向，箭頭跟著液體移動。每側卵巢有 3 條穿刺軸線，探頭都以前端圓頂為支點：先做的一側依序是第 1 條軸線（同一條線上一前一後兩個濾泡：抽完前面一個，探頭不轉，針只沿原線往前推進後面一個）、第 2 條、第 3 條；另一側鏡像，同樣順序。每條軸線第一次穿刺時，以及同一條軸線往前推進後面一個濾泡時，針尖都先停在濾泡壁外 0.5 秒瞄準，再刺進濾泡。換軸線時，針先往回退出濾泡，針尖斜面停在原來的濾泡壁上（為了不碰到還沒抽的濾泡，必要時多退一點），探頭轉到下一條軸線時針長不變，再往前推進。每個濾泡都做「抽、灌、抽」：針尖刺進濾泡 0.5 秒後負壓開始，黃色的濾泡液經吸引管流進試管，濾泡塌陷，吸乾後停頓 1 秒；接著注射筒推出淡粉紅色的培養液，經沖洗管與針灌入濾泡，濾泡變成淡粉紅、重新脹起；再抽一次，淡粉紅色的液體也流進同一支試管，濾泡再塌陷，吸乾後停頓 1 秒。試管裡的液體照抽出的順序分層：黃色在下、淡粉紅在上。一個濾泡用一支試管，抽完就從加溫架往上拿起、淡出，架上換一支空的。加溫架是半透明壓克力，2 個試管槽、透明底座，下方一條淡藍灰色帶，色帶上標示 37.0 °C。畫面上方角落是正面的超音波螢幕，同步顯示超音波畫面：扇形，卵巢灰色、濾泡黑色，導引線相對扇形中線往右斜約 30°，針的亮線與針尖亮點；灌入時黑色濾泡變回圓形；為了方便說明，螢幕裡的卵巢、濾泡、針與導引線放大為 1.5 倍。剖面上的淡灰扇形是超音波掃描範圍。7 個步驟：1 準備超音波：探頭沿子宮中線放入，前端對著子宮頸外口，螢幕亮起，看到卵巢與濾泡；2 對準濾泡：探頭以前端為支點轉向一側，導引線對準第一個濾泡；3 穿刺：針沿導引架穿過陰道壁進入卵巢，針尖在濾泡壁外停 0.5 秒瞄準，再刺進濾泡；4 沖洗濾泡液：抽、灌、抽，每次吸乾後停頓 1 秒，抽完這支試管拿起、淡出；5 抽吸下一個濾泡：針盡量不退出卵巢，先沿同一條軸線往前抽第 2 個濾泡，再退針、轉探頭、推進，抽第 3、4 個濾泡，每個都抽、灌、抽；6 另一側卵巢：針退回導引架，探頭經過子宮中線轉到另一側，螢幕跟著探頭掃過：這側卵巢移出畫面、子宮與子宮頸經過、另一側卵巢進入畫面；針穿過陰道壁後短暫停一下，再同樣抽另一側卵巢的 4 個濾泡；7 取卵結束：最後一支試管拿起、淡出；探頭不動，針全部退回導引架，取卵針連同兩條管淡出；之後探頭先看這側卵巢，再經過子宮中線轉到另一側看那側卵巢，螢幕上抽過的濾泡都塌成細縫；最後探頭退出、淡出，螢幕轉暗。"><desc>取卵手術互動圖解 v25。作者：李日升醫師（Dr. EmersonLi）；© 2026 李日升醫師，CC BY-NC-ND 4.0。https://emersonlitw.github.io/oocyte-retrieval/</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons. .iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
